<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Teacher - Save Audio</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --bg: #f8fafc;
        }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            display: flex; justify-content: center; padding: 20px; margin: 0;
        }
        .app-container {
            background: white; width: 100%; max-width: 500px;
            padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h2 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        p.desc { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; }
        
        textarea {
            width: 100%; height: 150px; padding: 15px; border: 2px solid #e2e8f0;
            border-radius: 15px; font-size: 16px; box-sizing: border-box; outline: none;
            transition: 0.3s; background: #fcfcfc;
        }
        textarea:focus { border-color: var(--primary); background: white; }

        .config {
            margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #475569; }
        select, input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; }

        .actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        button {
            padding: 15px; border: none; border-radius: 12px; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: 0.2s; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-play { background: var(--primary); color: white; }
        .btn-download { background: var(--secondary); color: white; display: none; }
        button:active { transform: scale(0.98); }

        #status { text-align: center; font-size: 13px; margin-top: 10px; color: var(--primary); font-weight: 500; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Teacher Amy 👩‍🏫</h2>
    <p class="desc">Nhập văn bản, nghe và tải bài giảng về máy</p>

    <textarea id="input-text" placeholder="Paste your English text here..."></textarea>

    <div class="config">
        <div>
            <label>Giọng đọc</label>
            <select id="voice-list"></select>
        </div>
        <div>
            <label>Tốc độ (0.9 là chuẩn)</label>
            <input type="range" id="rate" min="0.5" max="1.5" value="0.9" step="0.1">
        </div>
    </div>

    <div id="status">Sẵn sàng</div>

    <div class="actions">
        <button id="play-btn" class="btn-play">🔊 Bắt đầu đọc</button>
        <button id="download-btn" class="btn-download">📥 Tải file Audio về điện thoại</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const playBtn = document.getElementById('play-btn');
    const downloadBtn = document.getElementById('download-btn');
    const voiceList = document.getElementById('voice-list');
    const inputText = document.getElementById('input-text');
    const rate = document.getElementById('rate');
    const status = document.getElementById('status');

    let voices = [];

    // Lấy danh sách giọng đọc chất lượng cao
    function getVoices() {
        voices = synth.getVoices();
        voiceList.innerHTML = voices
            .filter(v => v.lang.includes('en'))
            .map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`)
            .join('');
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = getVoices;
    }

    playBtn.addEventListener('click', () => {
        if (inputText.value.trim() === "") return alert("Hãy nhập văn bản!");

        const utterance = new SpeechSynthesisUtterance(inputText.value);
        utterance.voice = voices.find(v => v.name === voiceList.value);
        utterance.rate = rate.value;

        utterance.onstart = () => {
            status.innerText = "正在 đọc... (Vui lòng nghe hết để tạo file)";
            playBtn.disabled = true;
            playBtn.style.opacity = "0.5";
        };

        utterance.onend = () => {
            status.innerText = "✅ Đã xong! Bạn có thể tải file.";
            playBtn.disabled = false;
            playBtn.style.opacity = "1";
            
            // Hiển thị nút tải về
            downloadBtn.style.display = "flex";
            
            // Kỹ thuật tải về: Sử dụng API của Google để lấy file mp3 thật
            const textToDownload = encodeURIComponent(inputText.value);
            const downloadUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${textToDownload}&tl=en&client=tw-ob`;
            
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.target = "_blank";
                link.download = "english_lesson.mp3";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
        };

        synth.speak(utterance);
    });

    getVoices();
</script>
</body>
</html>
