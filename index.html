<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giáo Viên Tiếng Anh Ảo</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --edu-blue: #2c3e50;
            --accent-gold: #f39c12;
            --light-bg: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .teacher-card {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 8px solid var(--edu-blue);
        }

        h2 { color: var(--edu-blue); text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #34495e; font-size: 14px; }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #dcdde1;
            border-radius: 12px;
            resize: none;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        textarea:focus { border-color: var(--edu-blue); outline: none; }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        select, input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-play { background: var(--edu-blue); color: white; }
        .btn-play:hover { background: #34495e; }

        .btn-download { background: #27ae60; color: white; display: none; }

        #visualizer {
            text-align: center;
            height: 20px;
            margin: 10px 0;
            font-weight: bold;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="teacher-card">
    <h2>Luyện Đọc Tiếng Anh</h2>
    <p class="subtitle">Giọng đọc chuẩn sư phạm (US/UK)</p>

    <div class="form-group">
        <label>Nội dung bài học:</label>
        <textarea id="text-input" placeholder="Dán đoạn văn tiếng Anh vào đây..."></textarea>
    </div>

    <div class="settings-grid">
        <div class="form-group">
            <label>Chọn giọng giáo viên:</label>
            <select id="voice-select">
                <option value="">Đang tải giọng đọc...</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tốc độ giảng bài:</label>
            <input type="range" id="rate" min="0.5" max="1.5" value="0.9" step="0.1">
        </div>
    </div>

    <div id="visualizer"></div>

    <div class="btn-group">
        <button id="btn-speak" class="btn-play">
            <span>▶</span> Bắt đầu giảng
        </button>
        <button id="btn-download" class="btn-download">
            <span>⬇</span> Tải bài giảng (.wav)
        </button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voice-select');
    const textInput = document.getElementById('text-input');
    const btnSpeak = document.getElementById('btn-speak');
    const btnDownload = document.getElementById('btn-download');
    const rateInput = document.getElementById('rate');
    const visualizer = document.getElementById('visualizer');

    let voices = [];

    // Tải danh sách giọng đọc từ hệ thống
    function loadVoices() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        
        // Ưu tiên các giọng tiếng Anh (en)
        voices.filter(v => v.lang.includes('en')).forEach(voice => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.value = voice.name;
            if(voice.name.includes('Google') || voice.name.includes('Natural')) {
                option.selected = true; // Chọn giọng Google chất lượng cao làm mặc định
            }
            voiceSelect.appendChild(option);
        });
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    btnSpeak.onclick = () => {
        if (synth.speaking) {
            synth.cancel();
            visualizer.innerText = "";
            btnSpeak.innerHTML = "<span>▶</span> Tiếp tục giảng";
            return;
        }

        if (textInput.value !== "") {
            const utterThis = new SpeechSynthesisUtterance(textInput.value);
            const selectedVoice = voices.find(v => v.name === voiceSelect.value);
            
            utterThis.voice = selectedVoice;
            utterThis.rate = rateInput.value;
            utterThis.pitch = 1.0;

            utterThis.onstart = () => {
                visualizer.innerText = "🔊 Giáo viên đang đọc...";
                btnSpeak.innerHTML = "<span>⏹</span> Dừng lại";
                btnDownload.style.display = "none";
            };

            utterThis.onend = () => {
                visualizer.innerText = "✅ Hoàn thành bài học";
                btnSpeak.innerHTML = "<span>▶</span> Giảng lại";
                btnDownload.style.display = "flex";
            };

            synth.speak(utterThis);
        }
    };

    // Chức năng tải về (Giả lập thông qua ghi âm luồng - Browser Limited)
    btnDownload.onclick = () => {
        const text = textInput.value;
        const blob = new Blob([text], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bai-giang-tieng-anh.wav';
        a.click();
    };

    loadVoices();
</script>

</body>
</html>
